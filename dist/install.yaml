apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: kube-symbiont
  name: kube-symbiont-system
---
apiVersion: scheduling.k8s.io/v1
description: Ballast priority for kube-symbiont phantom pods. High enough that normal
  (priority-0) workloads cannot preempt a phantom; the phantom must outlive the pods
  it protects. Install once per cluster alongside the operator.
globalDefault: false
kind: PriorityClass
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: kube-symbiont
  name: symbiont-ballast
value: 1000
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: shadowworkloads.symbiont.tensorhost.com
spec:
  group: symbiont.tensorhost.com
  names:
    kind: ShadowWorkload
    listKind: ShadowWorkloadList
    plural: shadowworkloads
    shortNames:
    - sw
    singular: shadowworkload
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.node
      name: Node
      type: string
    - jsonPath: .spec.source.type
      name: Source
      type: string
    - jsonPath: .status.phantomPod
      name: Phantom
      type: string
    - jsonPath: .status.currentCPU
      name: CPU
      type: string
    - jsonPath: .status.currentMemory
      name: Memory
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ShadowWorkload maintains a phantom ("ballast") pod whose resource requests
          mirror the real footprint of a bare-metal workload, making that footprint
          visible to the Kubernetes scheduler's allocatable ledger.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ShadowWorkload
            properties:
              metrics:
                description: metrics configures the Prometheus backend queried for
                  measurements.
                properties:
                  prometheusURL:
                    description: |-
                      prometheusURL is the base URL of the Prometheus HTTP API, e.g.
                      http://kube-prometheus-stack-prometheus.monitoring:9090.
                    pattern: ^https?://.+$
                    type: string
                  window:
                    description: |-
                      window is the range window the controller injects into generated
                      queries (docker source) — the smoothing horizon of the moving average.
                      promql passthrough embeds its own ranges; window still documents the
                      intended smoothing horizon.
                    pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                    type: string
                required:
                - prometheusURL
                - window
                type: object
              node:
                description: |-
                  node is the Kubernetes Node hosting the bare-metal workload. The phantom
                  pod is pinned to it via pod.spec.nodeName, so its requests are subtracted
                  from that node's allocatable in the scheduler ledger.
                maxLength: 253
                minLength: 1
                type: string
              source:
                description: |-
                  source declares what to measure on that node. Exactly one source block
                  must be set and it must match type.
                properties:
                  docker:
                    description: |-
                      docker shadows Docker containers running directly on the node
                      (outside the kubepods cgroup), as seen by the standalone cAdvisor job.
                      Required when type is docker.
                    properties:
                      cadvisorInstance:
                        description: |-
                          cadvisorInstance pins the Prometheus instance label (e.g.
                          "192.0.2.10:4194") to this node's standalone cAdvisor target. It is
                          required so a multi-target job can never aggregate other nodes into this
                          node's scheduler reservation.
                        minLength: 1
                        type: string
                      cadvisorJob:
                        default: cadvisor
                        description: |-
                          cadvisorJob is the Prometheus job label emitted by the standalone
                          cAdvisor instance monitoring this node.
                        type: string
                      selector:
                        description: |-
                          selector picks which containers to shadow. v0.1 implements only "all":
                          every Docker container on the node's system.slice.
                        enum:
                        - all
                        type: string
                    required:
                    - cadvisorInstance
                    - selector
                    type: object
                  promql:
                    description: |-
                      promql supplies raw PromQL for CPU cores and memory bytes. Required when
                      type is promql. Both queries must return a single vector sample after
                      aggregation (use sum()).
                    properties:
                      cpuCores:
                        description: |-
                          cpuCores is an instant-query expression returning total CPU cores used by
                          the workload. Rate the counter first, e.g.
                          sum(rate(container_cpu_usage_seconds_total{...}[5m])).
                        minLength: 1
                        type: string
                      memoryBytes:
                        description: |-
                          memoryBytes is an instant-query expression returning resident memory in
                          bytes, e.g.
                          sum(avg_over_time(container_memory_working_set_bytes{...}[5m])).
                          Working set is preferred: it is what eviction watches.
                        minLength: 1
                        type: string
                    required:
                    - cpuCores
                    - memoryBytes
                    type: object
                  type:
                    description: type selects the source implementation to resolve.
                    enum:
                    - docker
                    - promql
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: exactly one of source.docker or source.promql must be set
                  rule: '[has(self.docker), has(self.promql)].filter(x, x).size()
                    == 1'
                - message: source.type must match the configured source block
                  rule: (self.type == 'docker') == has(self.docker)
              update:
                description: update controls when observed drift turns into a phantom
                  resize.
                properties:
                  ceiling:
                    description: |-
                      ceiling safety-clamps the phantom upward so a runaway measurement can
                      never request more than this.
                    properties:
                      cpu:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 10m
                        description: cpu is a Kubernetes CPU quantity ("500m", "2").
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      memory:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 32Mi
                        description: memory is a Kubernetes memory quantity ("32Mi",
                          "8Gi").
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    required:
                    - cpu
                    - memory
                    type: object
                  deltaThresholdPercent:
                    default: 10
                    description: |-
                      deltaThresholdPercent is the minimum relative change (per dimension,
                      CPU or memory) between the phantom's current requests and the clamped
                      measurement before a resize is issued. Lower values track more tightly;
                      higher values dampen flapping.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  floor:
                    description: |-
                      floor clamps the phantom downward: when the workload is off or emits no
                      metrics, requests settle here instead of zero, keeping a small standing
                      reservation.
                    properties:
                      cpu:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 10m
                        description: cpu is a Kubernetes CPU quantity ("500m", "2").
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      memory:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 32Mi
                        description: memory is a Kubernetes memory quantity ("32Mi",
                          "8Gi").
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    required:
                    - cpu
                    - memory
                    type: object
                  pollInterval:
                    default: 30s
                    description: |-
                      pollInterval is how often the controller re-measures and re-evaluates
                      the phantom. Metric-driven reconciliation runs on this clock regardless
                      of CR changes.
                    pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                    type: string
                required:
                - ceiling
                - deltaThresholdPercent
                - floor
                - pollInterval
                type: object
                x-kubernetes-validations:
                - message: update.floor.cpu must be non-negative
                  rule: '!quantity(self.floor.cpu).isLessThan(quantity(''0''))'
                - message: update.floor.memory must be non-negative
                  rule: '!quantity(self.floor.memory).isLessThan(quantity(''0''))'
                - message: update.ceiling.cpu must be non-negative
                  rule: '!quantity(self.ceiling.cpu).isLessThan(quantity(''0''))'
                - message: update.ceiling.memory must be non-negative
                  rule: '!quantity(self.ceiling.memory).isLessThan(quantity(''0''))'
                - message: update.floor.cpu must not exceed update.ceiling.cpu
                  rule: '!quantity(self.ceiling.cpu).isLessThan(quantity(self.floor.cpu))'
                - message: update.floor.memory must not exceed update.ceiling.memory
                  rule: '!quantity(self.ceiling.memory).isLessThan(quantity(self.floor.memory))'
            required:
            - metrics
            - node
            - source
            - update
            type: object
          status:
            description: status defines the observed state of ShadowWorkload
            properties:
              conditions:
                description: |-
                  conditions represent observations of the phantom lifecycle. Known types:
                  Ready (phantom exists and tracks measurements), Degraded (node missing,
                  Prometheus unreachable, resize rejected, PriorityClass absent).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentCPU:
                anyOf:
                - type: integer
                - type: string
                description: currentCPU mirrors the phantom's current CPU request.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              currentMemory:
                anyOf:
                - type: integer
                - type: string
                description: currentMemory mirrors the phantom's current memory request.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              lastResize:
                description: lastResize is the time of the most recent accepted in-place
                  resize.
                format: date-time
                type: string
              phantomPod:
                description: |-
                  phantomPod is the name of the ballast pod maintained on spec.node, if
                  any has been created yet.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
