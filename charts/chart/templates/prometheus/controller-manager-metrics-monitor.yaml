{{- if .Values.prometheus.enabled }}
{{- if not .Values.metrics.enabled }}
{{- fail "prometheus.enabled=true requires metrics.enabled=true" }}
{{- end }}
{{- if and .Values.metrics.secure (empty .Values.metrics.tls.existingSecret) (not .Values.prometheus.allowInsecureTLS) }}
{{- fail "secure Prometheus scraping requires metrics.tls.existingSecret; set prometheus.allowInsecureTLS=true only for an explicitly accepted development-only scrape path" }}
{{- end }}
{{- if and .Values.metrics.secure (or (empty .Values.prometheus.scraperServiceAccount.name) (empty .Values.prometheus.scraperServiceAccount.namespace)) }}
{{- fail "secure Prometheus scraping requires prometheus.scraperServiceAccount.name and namespace so /metrics authorization is explicit" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "kube-symbiont.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
    {{- with .Values.prometheus.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: {{ include "kube-symbiont.resourceName" (dict "suffix" "controller-manager-metrics-monitor" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  endpoints:
  - {{- if .Values.metrics.secure }}
    bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    {{- end }}
    path: /metrics
    port: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
    scheme: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
    {{- if .Values.metrics.secure }}
    tlsConfig:
      serverName: {{ include "kube-symbiont.resourceName" (dict "suffix" "controller-manager-metrics-service" "context" $) }}.{{ .Release.Namespace }}.svc
      {{- if .Values.metrics.tls.existingSecret }}
      ca:
        secret:
          name: {{ .Values.metrics.tls.existingSecret }}
          key: {{ .Values.metrics.tls.caKey }}
      {{- else }}
      insecureSkipVerify: true
      {{- end }}
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "kube-symbiont.name" . }}
      control-plane: controller-manager
{{- end }}
