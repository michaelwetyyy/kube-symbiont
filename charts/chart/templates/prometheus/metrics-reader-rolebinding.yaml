{{- if and .Values.prometheus.enabled .Values.metrics.enabled .Values.metrics.secure }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-symbiont.resourceName" (dict "suffix" "prometheus-metrics-reader" "context" $) }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-symbiont.resourceName" (dict "suffix" "metrics-reader" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.prometheus.scraperServiceAccount.name }}
  namespace: {{ .Values.prometheus.scraperServiceAccount.namespace }}
{{- end }}
