## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  image:
    repository: ghcr.io/michaelwetyyy/kube-symbiont
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## Restrict workload-supplied Prometheus URLs to operator-approved origins.
## Matching is exact after normalizing scheme/host case, a DNS trailing dot,
## IP spelling, and default ports (http=80, https=443). URL paths do not affect
## the destination match. Use allowAny only when every ShadowWorkload author is
## trusted to select any controller-reachable HTTP(S) backend.
##
prometheusDestinationPolicy:
  allowedDestinations:
    - http://kube-prometheus-stack-prometheus.monitoring:9090
  allowAny: false

## RBAC configuration
##
rbac:
  ## Convenience helper-role scope only. The controller manager always uses
  ## a minimal ClusterRole because it must read cluster-scoped Nodes and
  ## PriorityClasses while reconciling namespaced ShadowWorkloads.
  ## - false (default): helper ClusterRoles
  ## - true: helper Roles in the release namespace
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (only when enabled=false)
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true
  tls:
    ## Existing Secret containing the verified metrics-server certificate.
    ## The chart mounts these keys for the manager and uses caKey from the
    ## ServiceMonitor. cert-manager may own the Secret, but is not required.
    existingSecret: ""
    caKey: ca.crt
    certKey: tls.crt
    keyKey: tls.key

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false
  ## Explicit development-only escape hatch. When secure metrics are enabled,
  ## ServiceMonitor rendering fails unless metrics.tls.existingSecret supplies
  ## a verified certificate or this unsafe override is deliberately enabled.
  allowInsecureTLS: false
  ## ServiceAccount used by the Prometheus server that follows this
  ## ServiceMonitor. Required for secure metrics so the chart can bind the
  ## non-resource /metrics reader permission explicitly.
  scraperServiceAccount:
    name: ""
    namespace: ""
  ## Also render a PrometheusRule with the recording rules and bounded alerts
  ## (drift, staleness, failures, flapping). Requires prometheus-operator.
  rule:
    enabled: false
  ## Extra labels for the ServiceMonitor, e.g. the selector label your
  ## Prometheus operator matches on (kube-prometheus-stack users typically
  ## set release: kube-prometheus-stack).
  ##
  # additionalLabels:
  #   release: kube-prometheus-stack

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false
