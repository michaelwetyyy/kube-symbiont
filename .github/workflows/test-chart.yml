name: Test Chart

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

# A PR commit is validated once through pull_request. New commits cancel stale
# validation for the same ref instead of consuming runners on obsolete code.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Helm chart
    runs-on: ubuntu-latest
    env:
      IMG: controller:latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install kind v0.30.0
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --output ./kind "https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-$(go env GOARCH)"
          echo '517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889  ./kind' | sha256sum --check
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Prepare kube-symbiont
        run: |
          make docker-build
          kind load docker-image "$IMG"

      - name: Install Helm
        run: make install-helm

      - name: Verify generated Helm CRD
        run: make verify-helm-crd

      - name: Lint Helm Chart
        run: |
          helm lint ./charts/chart

# TODO: Uncomment if cert-manager is enabled
#      - name: Install cert-manager via Helm (wait for readiness)
#        run: |
#          helm repo add jetstack https://charts.jetstack.io
#          helm repo update
#          helm install cert-manager jetstack/cert-manager \
#            --namespace cert-manager \
#            --create-namespace \
#            --set crds.enabled=true \
#            --wait \
#            --timeout 300s

# TODO: Uncomment if Prometheus is enabled
#      - name: Install Prometheus Operator CRDs
#        run: |
#          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#          helm repo update
#          helm install prometheus-crds prometheus-community/prometheus-operator-crds

      - name: Enforce Restricted Pod Security on Helm namespace
        run: |
          kubectl create namespace kube-symbiont-system
          kubectl label namespace kube-symbiont-system \
            pod-security.kubernetes.io/enforce=restricted \
            pod-security.kubernetes.io/enforce-version=latest \
            pod-security.kubernetes.io/audit=restricted \
            pod-security.kubernetes.io/audit-version=latest \
            pod-security.kubernetes.io/warn=restricted \
            pod-security.kubernetes.io/warn-version=latest

      - name: Deploy manager via Helm
        run: |
          make helm-deploy

      - name: Check Helm release status
        run: |
          make helm-status
