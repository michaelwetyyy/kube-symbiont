name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

# Serialize every human-facing image publication with candidate builds.
concurrency:
  group: kube-symbiont-image-publication
  cancel-in-progress: false

jobs:
  release:
    name: Gate, build, scan, attest, and release
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    env:
      IMAGE: ghcr.io/michaelwetyyy/kube-symbiont
    steps:
      - name: Clone the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify exact release source and repository gates
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$EXPECTED_SHA"
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 -B hack/verify_release.py --kind stable --tag "$RELEASE_TAG"
          python3 -B -m unittest hack/test_verify_release.py
          go mod tidy
          git diff --exit-code go.mod go.sum
          make test
          make lint-config
          make lint
          make verify-installer
          helm lint charts/chart
          python3 -B hack/verify-monitoring.py
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing immutable stable tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          immutable_tag="${IMAGE}:${RELEASE_TAG#v}"
          if output="$(docker buildx imagetools inspect "$immutable_tag" 2>&1)"; then
            echo "Refusing to replace existing stable tag: $immutable_tag" >&2
            exit 1
          fi
          if [[ "$output" != *"not found"* && "$output" != *"manifest unknown"* ]]; then
            echo "Could not prove stable tag is absent: $immutable_tag" >&2
            printf '%s\n' "$output" >&2
            exit 1
          fi

      - name: Compute image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # The stable tag and its moving aliases are created only after this
      # untagged digest passes the vulnerability gate.
      - name: Build untagged stable digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.RELEASE_TAG }}
            VCS_REF=${{ env.EXPECTED_SHA }}
          provenance: mode=max
          sbom: true

      - name: Scan stable digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Promote scanned digest to stable tags
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          minor="${version%.*}"
          immutable_tag="${IMAGE}:${version}"
          if output="$(docker buildx imagetools inspect "$immutable_tag" 2>&1)"; then
            echo "Stable tag appeared during the run; refusing collision: $immutable_tag" >&2
            exit 1
          fi
          if [[ "$output" != *"not found"* && "$output" != *"manifest unknown"* ]]; then
            echo "Could not prove stable tag is still absent: $immutable_tag" >&2
            printf '%s\n' "$output" >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "$immutable_tag" \
            --tag "${IMAGE}:${minor}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${IMAGE_DIGEST}"
          for published_tag in "$immutable_tag" "${IMAGE}:${minor}" "${IMAGE}:latest"; do
            published_digest="$(docker buildx imagetools inspect "$published_tag" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
            test "$published_digest" = "$IMAGE_DIGEST"
          done

      - name: Build digest-pinned installer
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          make build-installer IMG="${IMAGE}@${IMAGE_DIGEST}"
          sha256sum dist/install.yaml > dist/install.yaml.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/install.yaml dist/install.yaml.sha256 \
            --verify-tag \
            --title "kube-symbiont $RELEASE_TAG" \
            --generate-notes \
            --notes "Experimental operator; Kubernetes 1.29+ required. Image: ${IMAGE}@${IMAGE_DIGEST}. Supported platforms: linux/amd64 and linux/arm64."
