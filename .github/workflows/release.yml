name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable Git tag to create, e.g. v0.2.0
        required: true
        type: string
      candidate_tag:
        description: Tested candidate tag to promote, e.g. v0.2.0-rc.4
        required: true
        type: string
      expected_candidate_digest:
        description: Exact tested OCI index digest (sha256:...)
        required: true
        type: string
      expected_sha:
        description: Exact main commit to tag and release
        required: true
        type: string

permissions: {}

# Serialize every human-facing image publication with candidate builds.
concurrency:
  group: kube-symbiont-image-publication
  cancel-in-progress: false

jobs:
  release:
    name: Verify candidate and promote exact digest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/michaelwetyyy/kube-symbiont
      RELEASE_TAG: ${{ inputs.release_tag }}
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      EXPECTED_DIGEST: ${{ inputs.expected_candidate_digest }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CANDIDATE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          test "${CANDIDATE_TAG%-rc.*}" = "$RELEASE_TAG"
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Clone the exact release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_sha }}

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Verify exact release source and repository gates
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 -B hack/verify_release.py --kind stable --tag "$RELEASE_TAG"
          python3 -B -m unittest hack/test_verify_release.py
          go mod tidy
          git diff --exit-code go.mod go.sum
          make test
          make lint-config
          make lint
          make verify-installer
          helm lint charts/chart
          python3 -B hack/verify-monitoring.py
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the tested candidate digest
        shell: bash
        run: |
          candidate_ref="${IMAGE}:${CANDIDATE_TAG}"
          candidate_digest="$(docker buildx imagetools inspect "$candidate_ref" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
          test "$candidate_digest" = "$EXPECTED_DIGEST"

      - name: Promote exact candidate digest to stable image tags
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          minor="${version%.*}"
          immutable_tag="${IMAGE}:${version}"

          if output="$(docker buildx imagetools inspect "$immutable_tag" 2>&1)"; then
            existing_digest="$(printf '%s\n' "$output" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
            test "$existing_digest" = "$EXPECTED_DIGEST"
          elif [[ "$output" == *"not found"* || "$output" == *"manifest unknown"* ]]; then
            docker buildx imagetools create \
              --tag "$immutable_tag" \
              "${IMAGE}@${EXPECTED_DIGEST}"
          else
            echo "Could not prove stable tag state: $immutable_tag" >&2
            printf '%s\n' "$output" >&2
            exit 1
          fi

          # Moving aliases intentionally advance only after the immutable tag is proven.
          docker buildx imagetools create \
            --tag "${IMAGE}:${minor}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}@${EXPECTED_DIGEST}"

          for published_tag in "$immutable_tag" "${IMAGE}:${minor}" "${IMAGE}:latest"; do
            published_digest="$(docker buildx imagetools inspect "$published_tag" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
            test "$published_digest" = "$EXPECTED_DIGEST"
          done

      - name: Create or verify immutable Git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null)"; then
            test "$tag_sha" = "$EXPECTED_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${RELEASE_TAG}" \
              -f sha="$EXPECTED_SHA" >/dev/null
          fi
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha')"
          test "$tag_sha" = "$EXPECTED_SHA"

      - name: Build digest-pinned installer
        run: |
          make build-installer IMG="${IMAGE}@${EXPECTED_DIGEST}"
          sha256sum dist/install.yaml > dist/install.yaml.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            dist/install.yaml dist/install.yaml.sha256 \
            --verify-tag \
            --title "kube-symbiont $RELEASE_TAG" \
            --generate-notes \
            --notes "Experimental operator; Kubernetes 1.29+ required. Image: ${IMAGE}@${EXPECTED_DIGEST}. Promoted unchanged from ${CANDIDATE_TAG}. Supported platforms: linux/amd64 and linux/arm64."
