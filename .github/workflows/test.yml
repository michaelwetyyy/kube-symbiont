name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

# A PR commit is validated once through pull_request. New commits cancel stale
# validation for the same ref instead of consuming runners on obsolete code.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    name: Unit and envtest
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          python3 -B -m unittest hack/test_verify_release.py
          make test
          make verify-installer
          git diff --exit-code
