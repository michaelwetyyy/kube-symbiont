name: Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

# A PR commit is validated once through pull_request. New commits cancel stale
# validation for the same ref instead of consuming runners on obsolete code.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
    name: Unit and envtest
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          python3 -B -m unittest hack/test_verify_release.py
          make test
          make verify-installer
          git diff --exit-code
