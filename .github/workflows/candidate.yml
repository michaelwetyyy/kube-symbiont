name: Candidate Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable prerelease image tag (for example, v0.2.0-rc.1)
        required: true
        type: string
      expected_sha:
        description: Exact 40-character commit SHA expected at origin/main
        required: true
        type: string

permissions: {}

# Candidate and stable publication share this lock. A running publication is
# never cancelled midway through registry promotion.
concurrency:
  group: kube-symbiont-image-publication
  cancel-in-progress: false

jobs:
  candidate:
    name: Gate, build, scan, attest, and promote candidate
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE: ghcr.io/michaelwetyyy/kube-symbiont
    steps:
      - name: Validate dispatch inputs
        env:
          CANDIDATE_TAG: ${{ inputs.image_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          [[ "$CANDIDATE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Clone the exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.expected_sha }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify exact source and repository gates
        env:
          CANDIDATE_TAG: ${{ inputs.image_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"
          python3 -B hack/verify_release.py --kind candidate --tag "$CANDIDATE_TAG"
          python3 -B -m unittest hack/test_verify_release.py
          go mod tidy
          git diff --exit-code go.mod go.sum
          make test
          make lint-config
          make lint
          make verify-installer
          helm lint charts/chart
          python3 -B hack/verify-monitoring.py
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing immutable candidate tag
        env:
          CANDIDATE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          target="${IMAGE}:${CANDIDATE_TAG}"
          if output="$(docker buildx imagetools inspect "$target" 2>&1)"; then
            echo "Refusing to replace existing candidate tag: $target" >&2
            exit 1
          fi
          if [[ "$output" != *"not found"* && "$output" != *"manifest unknown"* ]]; then
            echo "Could not prove candidate tag is absent: $target" >&2
            printf '%s\n' "$output" >&2
            exit 1
          fi

      # Push by digest only. The requested candidate tag remains absent until
      # the exact multi-platform digest has passed the vulnerability gate.
      - name: Build untagged candidate digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          CANDIDATE_TAG: ${{ inputs.image_tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ env.CANDIDATE_TAG }}
            VCS_REF=${{ env.EXPECTED_SHA }}
          provenance: mode=max
          sbom: true

      - name: Scan candidate digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Promote scanned digest to immutable candidate tag
        env:
          CANDIDATE_TAG: ${{ inputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          target="${IMAGE}:${CANDIDATE_TAG}"
          if output="$(docker buildx imagetools inspect "$target" 2>&1)"; then
            echo "Candidate tag appeared during the run; refusing collision: $target" >&2
            exit 1
          fi
          if [[ "$output" != *"not found"* && "$output" != *"manifest unknown"* ]]; then
            echo "Could not prove candidate tag is still absent: $target" >&2
            printf '%s\n' "$output" >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "$target" \
            "${IMAGE}@${IMAGE_DIGEST}"
          published_digest="$(docker buildx imagetools inspect "$target" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
          test "$published_digest" = "$IMAGE_DIGEST"
