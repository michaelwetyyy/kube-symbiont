# Dogfood reference: shadow one bare-metal systemd service on node `lab`
# through the standalone cAdvisor scrape target.
apiVersion: symbiont.tensorhost.com/v1alpha1
kind: ShadowWorkload
metadata:
  name: lab-minecraft
spec:
  node: lab

  source:
    type: systemd
    systemd:
      unit: minecraft.service
      cadvisorJob: cadvisor-host
      cadvisorInstance: 192.0.2.10:4194

  metrics:
    prometheusURL: http://kube-prometheus-stack-prometheus.monitoring:9090
    window: 5m

  update:
    deltaThresholdPercent: 10
    pollInterval: 30s
    floor:
      cpu: 50m
      memory: 64Mi
    ceiling:
      cpu: "4"
      memory: 3Gi

# Cgroup alternative:
# source:
#   type: cgroup
#   cgroup:
#     path: /system.slice/my-worker-*.scope
#     cadvisorJob: cadvisor-host
#     cadvisorInstance: 192.0.2.10:4194
#
# Raw PromQL remains available as an escape hatch for sources that cannot be
# expressed by the typed source kinds.
