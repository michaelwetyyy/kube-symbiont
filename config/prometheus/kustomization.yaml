resources:
- monitor.yaml
- rules.yaml

# [PROMETHEUS-WITH-CERTS] The following patch configures the ServiceMonitor in ../prometheus
# to securely reference certificates created and managed by cert-manager.
# Additionally, ensure that you uncomment the [METRICS WITH CERTMANAGER] patch under config/default/kustomization.yaml
# to mount the "metrics-server-cert" secret in the Manager Deployment.
#patches:
#  - path: monitor_tls_patch.yaml
#    target:
#      kind: ServiceMonitor

# The ServiceMonitor above is deliberately distribution-neutral: it carries
# only kube-symbiont's own labels and never bakes in a specific operator's
# selector (e.g. no hardcoded release= label). To adopt it with a monitoring
# stack that requires one, layer your own kustomization over ../default with
# this directory enabled ([PROMETHEUS] under config/default/kustomization.yaml)
# and patch on whatever label your operator selects on, e.g. for
# kube-prometheus-stack:
#
#   resources:
#   - ../../default
#   patches:
#   - target:
#       group: monitoring.coreos.com
#       version: v1
#       kind: ServiceMonitor
#       name: kube-symbiont-controller-manager-metrics-monitor
#     patch: |-
#       - op: add
#         path: /metadata/labels/release
#         value: kube-prometheus-stack
