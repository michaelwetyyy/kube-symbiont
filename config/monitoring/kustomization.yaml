apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Non-default adoption profile: installs kube-symbiont together with its
# ServiceMonitor, PrometheusRule and Grafana sidecar dashboard in the same
# namespace. The 30s alert profile matches the sample ShadowWorkload cadence.
namespace: kube-symbiont-system

resources:
- ../symbiont
- ../default
- ../prometheus
- ../grafana

patches:
- target:
    group: monitoring.coreos.com
    version: v1
    kind: ServiceMonitor
    name: controller-manager-metrics-monitor
  patch: |-
    - op: add
      path: /metadata/labels/release
      value: kube-prometheus-stack
- target:
    group: monitoring.coreos.com
    version: v1
    kind: PrometheusRule
    name: controller-manager-rules
  patch: |-
    - op: add
      path: /metadata/labels/release
      value: kube-prometheus-stack
