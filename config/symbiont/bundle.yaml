apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/name: kube-symbiont
    app.kubernetes.io/managed-by: kustomize
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
  name: kube-symbiont-system
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: symbiont-ballast
  labels:
    app.kubernetes.io/name: kube-symbiont
    app.kubernetes.io/managed-by: kustomize
value: 1000
globalDefault: false
description: >-
  Ballast priority for kube-symbiont phantom pods. High enough that normal
  (priority-0) workloads cannot preempt a phantom; the phantom must outlive
  the pods it protects. Install once per cluster alongside the operator.
