# This rule is not used by the project kube-symbiont itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to symbiont.tensorhost.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kube-symbiont
    app.kubernetes.io/managed-by: kustomize
  name: shadowworkload-viewer-role
rules:
- apiGroups:
  - symbiont.tensorhost.com
  resources:
  - shadowworkloads
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - symbiont.tensorhost.com
  resources:
  - shadowworkloads/status
  verbs:
  - get
